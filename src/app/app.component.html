<input type="text" [formControl]="txtInput" name="txtInput">
<button (click)="getUser()"> Get User </button>
<button (click)="refreshUser()"> Refresh User </button>

<form [formGroup]="userForm">
    <label> Password
        <input type="text" name="password" [formControlName]="'password'">
    </label>
    <br />
    <label> Confirm Password
        <input type="text" name="confirmpassword" [formControlName]="'cnfPassword'">
    </label>

    @if (!passwordMatch) {
    <div> Password does not match</div>
    }
</form>
